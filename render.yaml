services:
  - type: web
    name: discord-backend
    runtime: docker
    repo: https://github.com/Setyhoseini/discord-clone
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discord-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
    dockerfilePath: ./backend.Dockerfile

  - type: web
    name: discord-frontend
    runtime: docker
    repo: https://github.com/Setyhoseini/discord-clone
    plan: free
    dockerfilePath: ./frontend.Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://discord-backend.onrender.com

databases:
  - name: discord-db
    plan: free